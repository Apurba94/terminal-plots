[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-plots"
version = "0.1.0"
description = "Quick terminal histograms, bar charts and sparklines for CSV columns."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
terminal-plots = "terminal_plots.cli:main"

[tool.setuptools]
packages = ["terminal_plots"]
